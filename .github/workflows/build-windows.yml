# Dong goi .exe tren Windows. Mac khong xuat duoc VideosCreator.exe.
# Chay: GitHub -> Actions -> build-windows -> Run workflow
# Khach tai artifact VideosCreator-windows (zip ca folder, double-click .exe).
name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "exe-*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install Python deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build WebView2 host DLL
        shell: pwsh
        run: ./packaging/build_win_webview.ps1

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean VideosCreator.spec

      - name: Copy ffmpeg + native window + readme next to exe
        shell: pwsh
        run: |
          ./scripts/copy_ffmpeg_win.ps1 -DestDir dist\VideosCreator
          if (Test-Path dist\VideosCreator\_internal) {
            ./scripts/copy_ffmpeg_win.ps1 -DestDir dist\VideosCreator\_internal
          }
          $dll = "dist\native\VideosCreatorWebView.dll"
          if (-not (Test-Path $dll)) { throw "Thieu $dll" }
          Copy-Item $dll dist\VideosCreator\VideosCreatorWebView.dll -Force
          Copy-Item scripts\WINDOWS_README.txt dist\VideosCreator\README.txt -Force
          Get-Item dist\VideosCreator\VideosCreator.exe, dist\VideosCreator\ffmpeg.exe, dist\VideosCreator\ffprobe.exe, dist\VideosCreator\VideosCreatorWebView.dll
          & dist\VideosCreator\ffmpeg.exe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe copy khong chay duoc" }

      - name: Bundle OPENAI_API_KEY into dist .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: pwsh
        run: |
          if (-not $env:OPENAI_API_KEY) {
            throw "Thieu GitHub secret OPENAI_API_KEY. Dat secret roi Run workflow lai."
          }
          $body = "OPENAI_API_KEY=$($env:OPENAI_API_KEY)`r`nDYFLOW_DESKTOP=1`r`n"
          $dests = @(
            "dist\VideosCreator\.env",
            "dist\VideosCreator\_internal\.env"
          )
          foreach ($d in $dests) {
            $dir = Split-Path $d
            if (Test-Path $dir) {
              Set-Content -Path $d -Value $body -Encoding ascii -NoNewline
            }
          }
          if (-not (Test-Path "dist\VideosCreator\.env")) {
            throw "Khong ghi duoc dist\VideosCreator\.env"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VideosCreator-windows
          path: dist/VideosCreator
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          include-hidden-files: true
