<!-- Modal Cap nhat VideosCreator -->
<div class="update-modal-backdrop" id="update-modal" hidden style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
  <div class="update-modal-card" style="background: #141724; border: 1px solid rgba(0, 242, 234, 0.35); border-radius: 14px; width: 100%; max-width: 480px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); overflow: hidden; animation: popIn 0.2s ease-out;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02);">
      <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px;">
        <span>🚀</span> Cập nhật VideosCreator
      </h3>
      <button type="button" class="btn ghost btn-xs" id="update-modal-close" style="padding: 4px 8px; font-size: 14px; cursor: pointer; color: #8a8d9f;">✕</button>
    </div>

    <div style="padding: 20px; display: flex; flex-direction: column; gap: 14px;">
      <!-- Thong tin phien ban hien tai -->
      <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 10px 14px;">
        <span style="font-size: 13px; color: #8a8d9f;">Phiên bản hiện tại:</span>
        <span style="font-size: 13.5px; font-weight: 700; color: #00f2ea;" id="update-curr-version">v{{ app_version|default('1.0.1') }}</span>
      </div>

      <!-- Khung ket qua kiem tra -->
      <div id="update-status-box" style="padding: 12px 14px; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); font-size: 13px; color: #d0d3e2; min-height: 48px; display: flex; flex-direction: column; justify-content: center;">
        <span id="update-status-text">Bấm nút "Kiểm tra bản mới" để tìm kiếm cập nhật từ máy chủ.</span>
        <div id="update-changelog-wrap" hidden style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1);">
          <strong style="color: #4ade80; display: block; margin-bottom: 4px;">Nội dung bản mới:</strong>
          <p id="update-changelog-text" style="margin: 0; font-size: 12px; color: #9da2b8; white-space: pre-line;"></p>
        </div>
      </div>

      <!-- Thanh tien do tai patch -->
      <div id="update-progress-wrap" hidden style="display: none; flex-direction: column; gap: 6px;">
        <div style="background: rgba(255,255,255,0.08); height: 8px; border-radius: 4px; overflow: hidden;">
          <div id="update-progress-bar" style="background: linear-gradient(90deg, #00f2ea, #38bdf8); width: 0%; height: 100%; transition: width 0.3s ease;"></div>
        </div>
        <span id="update-progress-label" style="font-size: 11.5px; color: #38bdf8; text-align: center;">Đang tải bản vá...</span>
      </div>

      <!-- Cac nut hanh dong -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button type="button" class="btn primary" id="update-check-btn" style="padding: 10px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; width: 100%;">
          🔍 Kiểm tra bản mới
        </button>
        <button type="button" class="btn primary" id="update-apply-btn" hidden style="display: none; background: linear-gradient(135deg, #10b981, #059669); padding: 11px 16px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;">
          ⚡ Tải & Cập nhật ngay (siêu tốc)
        </button>
        <button type="button" class="btn primary" id="update-restart-btn" hidden style="display: none; background: linear-gradient(135deg, #0284c7, #2563eb); padding: 12px 16px; font-size: 14.5px; font-weight: 700; cursor: pointer; width: 100%;">
          🔄 Khởi động lại app ngay
        </button>
      </div>

      <!-- Tuy chon cap nhat thu cong tu file zip -->
      <div style="margin-top: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <input type="file" id="update-file-input" accept=".zip" hidden />
        <button type="button" class="btn ghost btn-xs" id="update-pick-file-btn" style="font-size: 11.5px; cursor: pointer;">
          📁 Cài từ file patch (.zip)
        </button>
        {% if patch_active %}
        <button type="button" class="btn ghost btn-xs danger" id="update-rollback-btn" style="font-size: 11.5px; cursor: pointer; color: #ff8a8a;">
          ↺ Khôi phục bản gốc
        </button>
        {% endif %}
      </div>
    </div>
  </div>
</div>
